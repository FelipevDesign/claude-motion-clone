<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
<script src="/shim.js"></script>
</head>
<body>
<title>Claude Motion Clone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:wght@400;500;600;700&display=swap">
<style>
/* Layout: estúdio de desktop em duas colunas, como o Motion: conversa à esquerda; painel da animação à direita com cabeçalho, palco, barra de reprodução, faixa de cenas e painel Tweaks recolhível. Tema escuro por padrão, com variante clara. */
:root{
  --bg:#1C1B19; --panel:#242321; --panel2:#2C2B28; --soft:#353430; --line:#3A3935; --line2:#4A4844;
  --fg:#ECEBE6; --muted:#A09E97; --faint:#76746E; --stagebg:#191816;
  --pill:#F2F1EC; --pill-fg:#1C1B19; --accent:#D98463; --accent-soft:rgba(217,132,99,.16); --on-accent:#1C1B19;
  --sel:#3C82F6; --sel-soft:rgba(60,130,246,.18); --focus:#5B9BFF;
  --ok:#6CC28C; --warn:#E3B04B; --bad:#F28B82; --audio:#6FB7C7; --kf:#E0A21B;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark; box-sizing:border-box; height:100%;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F2EE; --panel:#FFFFFF; --panel2:#F6F5F1; --soft:#ECEAE4; --line:#E2E0D9; --line2:#D2CFC6;
    --fg:#1F1E1C; --muted:#68665F; --faint:#8E8B83; --stagebg:#E9E7E1;
    --pill:#1F1E1C; --pill-fg:#FFFFFF; --accent:#B8573A; --accent-soft:rgba(184,87,58,.12); --on-accent:#FFFFFF;
    --sel:#2F6FE0; --sel-soft:rgba(47,111,224,.12); --focus:#2F6FE0;
    --ok:#2F7D4F; --warn:#A86A00; --bad:#C0392B; --audio:#3C7C8C; --kf:#C48A0E;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F2EE; --panel:#FFFFFF; --panel2:#F6F5F1; --soft:#ECEAE4; --line:#E2E0D9; --line2:#D2CFC6;
  --fg:#1F1E1C; --muted:#68665F; --faint:#8E8B83; --stagebg:#E9E7E1;
  --pill:#1F1E1C; --pill-fg:#FFFFFF; --accent:#B8573A; --accent-soft:rgba(184,87,58,.12); --on-accent:#FFFFFF;
  --sel:#2F6FE0; --sel-soft:rgba(47,111,224,.12); --focus:#2F6FE0;
  --ok:#2F7D4F; --warn:#A86A00; --bad:#C0392B; --audio:#3C7C8C; --kf:#C48A0E;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;min-width:980px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none}
#app{height:100%;display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr);gap:12px;position:relative}
#app.wide{grid-template-columns:0 minmax(0,1fr);gap:0}
#app.wide #chatPanel{display:none}
#app.noart{grid-template-columns:minmax(340px,760px) 0;justify-content:center}
#app.noart #artifact{display:none}

/* ---------- conversa ---------- */
#chatPanel{display:flex;flex-direction:column;min-height:0;min-width:0}
.chead{display:flex;align-items:center;gap:8px;padding:6px 6px 10px;min-height:40px}
.chead .ttl{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.chead .ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.chead .sp{flex:1}
.mode{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--soft);color:var(--muted);white-space:nowrap}
.mode.live{background:var(--accent-soft);color:var(--accent)}
.ghost{border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);padding:0}
.ghost:hover{background:var(--soft);color:var(--fg)}
.ghost[aria-pressed="true"]{background:var(--soft);color:var(--fg)}
.msgs{flex:1;min-height:0;overflow:auto;padding:8px 10px 16px;display:flex;flex-direction:column;gap:18px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.empty .play{width:76px;height:76px;border-radius:50%;border:2px solid var(--fg);display:grid;place-items:center;opacity:.9}
.empty .play svg{width:30px;height:30px;margin-left:4px}
.empty h2{margin:6px 0 4px;font:500 25px/1.2 var(--font-display);text-wrap:balance}
.sugg{display:flex;flex-direction:column;gap:8px;align-items:center}
.sugg button{border:0;background:var(--panel2);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:500;max-width:330px;line-height:1.35}
.sugg button:hover{background:var(--soft)}
.m.user{align-self:flex-end;background:var(--panel2);border-radius:16px;padding:9px 13px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.user .thumbs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.m.user .thumbs img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.m.ai{min-width:0;overflow-wrap:anywhere}
.m.ai p{margin:0 0 8px;white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.m.ai .tools{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.m.ai .acts{display:flex;gap:2px;align-items:center;color:var(--muted)}
.m.ai .acts .ghost{width:26px;height:26px}
.m.ai .acts .ghost svg{width:14px;height:14px}
.m.ai .meta{font-size:12px;color:var(--muted);margin-left:6px}
.linkbtn{border:0;background:transparent;color:var(--accent);padding:0;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;display:flex;align-items:center;gap:10px;margin:2px 0 8px;width:100%;text-align:left}
.card:hover{border-color:var(--line2)}
.card .th{width:64px;aspect-ratio:16/9;border-radius:6px;background:var(--soft);flex:none;display:grid;place-items:center;color:var(--fg)}
.card b{display:block;font-size:13px}
.card span{color:var(--muted);font-size:12px}
.ask{border:1px solid var(--line);border-radius:12px;padding:10px;margin:2px 0 8px;background:var(--panel)}
.ask b{display:block;margin-bottom:6px;font-size:13px}
.ask .opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px 10px;font-size:13px;text-align:left}
.opt:hover{background:var(--soft)}
.dots{display:inline-flex;gap:4px;padding:6px 0;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.dots span{font-size:12.5px;color:var(--muted);margin-left:6px}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.compose{padding:4px 2px 2px;display:flex;flex-direction:column;gap:6px}
.box{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:8px 8px 8px 10px;position:relative}
.box:focus-within{border-color:var(--line2)}
.box .row{display:flex;align-items:flex-end;gap:6px}
.box textarea{flex:1;border:0;background:transparent;resize:none;min-height:24px;max-height:160px;outline:none;padding:5px 2px;line-height:1.45}
.box .att{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.box .att:empty{display:none}
.box .att span{position:relative}
.box .att img{width:40px;height:40px;object-fit:cover;border-radius:6px;display:block}
.box .att button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:11px;line-height:18px;padding:0}
.send{width:30px;height:30px;border-radius:9px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35}
.cfoot{display:flex;align-items:center;gap:14px;padding:0 6px;font-size:12.5px;color:var(--muted)}
.cfoot .sp{flex:1}
.cfoot button{border:0;background:transparent;color:var(--muted);padding:2px 0;font-size:12.5px}
.cfoot button:hover{color:var(--fg)}
.cfoot select{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:2px;cursor:pointer}
.cfoot b{color:var(--fg);font-weight:600}
.foot{font-size:11.5px;color:var(--faint);margin:0;padding:0 6px}
.plusmenu{position:absolute;left:6px;bottom:46px;z-index:30;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.35)}

/* ---------- painel da animação ---------- */
#artifact{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
#artifact:fullscreen{border-radius:0}
.ahead{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;min-height:46px;position:relative}
.titlebtn{display:flex;align-items:center;gap:4px;border:0;background:transparent;padding:4px 6px;border-radius:8px;font-weight:500;color:var(--fg);max-width:46%;min-width:0}
.titlebtn:hover{background:var(--soft)}
.titlebtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#projName{position:absolute;left:12px;top:9px;width:300px;max-width:45%;height:28px;border:1px solid var(--sel);border-radius:8px;background:var(--panel2);padding:0 8px;font-weight:500;z-index:5}
.save{font-size:12px;color:var(--faint);white-space:nowrap}
.save.bad{color:var(--bad)}
.ahead .sp{flex:1}
.peers{display:flex;align-items:center;margin-right:4px}
.peers img,.peers span{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);margin-left:-6px;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted)}
.peers img:first-child,.peers span:first-child{margin-left:0}
.split{display:flex;align-items:center;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.split .ghost{height:28px;border-radius:8px}
.split .ghost.cv{width:22px}
.split .ghost.cv svg{width:12px;height:12px}
.split .ghost[aria-pressed="true"]{background:var(--sel-soft);color:var(--sel)}
.sharebtn{height:30px;padding:0 12px;border-radius:9px;border:0;background:var(--pill);color:var(--pill-fg);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.sharebtn svg{width:14px;height:14px}
.pop{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 36px rgba(0,0,0,.35);min-width:220px;max-height:min(72vh,600px);overflow:auto}
.pop h4{margin:8px 8px 4px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
.pop h4:first-child{margin-top:4px}
.mi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:7px 9px;border-radius:8px;text-align:left;font-size:13.5px}
.mi:hover{background:var(--soft)}
.mi .k{margin-left:auto;color:var(--faint);font-size:12px}
.mi[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--sel)}
.pop .note{color:var(--muted);font-size:12.5px;margin:4px 9px 8px;line-height:1.45}
.pop .row{display:flex;align-items:center;gap:8px;padding:5px 9px;font-size:13px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.partners{display:flex;flex-wrap:wrap;gap:5px;margin:4px 9px 6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
.chip.soon{border-style:dashed}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 6px}
.lib button{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:0;aspect-ratio:1;overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted)}
.lib button img,.lib button video{width:100%;height:100%;object-fit:cover}
.lib button span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;background:rgba(0,0,0,.6);color:#fff;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.abody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.abody.tw{grid-template-columns:minmax(0,1fr) 300px}
.astage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stagebg);border-top:1px solid var(--line)}
.stagewrap{flex:1;min-height:200px;container-type:size;display:grid;place-items:center;padding:22px 26px;position:relative}
.stage{--ar:1.7778;width:min(100cqw,calc(100cqh*var(--ar)));aspect-ratio:var(--ar);max-width:100%;position:relative;overflow:hidden;background:#111;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.stage canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;touch-action:none;cursor:default}
.ov.comment{cursor:crosshair}
.ov svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.selbox{position:absolute;border:1.5px solid var(--sel);border-radius:2px;pointer-events:none;transform-origin:center}
.selbox.kf{border-color:var(--kf)}
.selbox.hl{border-style:dashed}
.selbox .hnd{position:absolute;right:-6px;bottom:-6px;width:11px;height:11px;background:#fff;border:1.5px solid var(--sel);border-radius:3px;pointer-events:auto;cursor:nwse-resize}
.selbox.hl .hnd{display:none}
.pin{position:absolute;transform:translate(-50%,-100%) rotate(-45deg);width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--sel);color:#fff;border:2px solid #fff;font:700 12px var(--font-ui);display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin span{transform:rotate(45deg)}
.pin.done{background:#6b6b6b}
.cpop{position:absolute;z-index:5;width:260px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 28px rgba(0,0,0,.4);cursor:default}
.cpop textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:6px 8px;resize:none}
.cpop .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:flex-end}
.cpop .ctx{font-size:12px;color:var(--muted);margin-bottom:6px}
.toolpill{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toolpill .ghost{width:30px;height:28px}
.toolpill .sepv{width:1px;height:18px;background:var(--line);margin:0 2px}
.toolpill .ghost.rec[aria-pressed="true"]{background:rgba(242,139,130,.18);color:var(--bad)}
.thumb{position:absolute;z-index:8;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.thumb canvas{display:block;border-radius:5px;width:220px}
.thumb div{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.thumb b{color:var(--fg)}

.transport{display:flex;align-items:center;gap:4px;padding:6px 10px 4px}
.transport .time{font:500 12.5px var(--font-ui);font-variant-numeric:tabular-nums;margin-left:6px}
.transport .time i{font-style:normal;color:var(--faint)}
.transport .sp{flex:1}
.transport .ghost svg{width:17px;height:17px}
.vol{width:70px;accent-color:var(--fg);height:4px}
.tweaksbtn{height:28px;padding:0 10px;border-radius:8px;border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px}
.tweaksbtn:hover{background:var(--soft);color:var(--fg)}
.tweaksbtn[aria-pressed="true"]{background:var(--soft);color:var(--fg)}
.strip{padding:2px 10px 10px;position:relative}
.track{position:relative;height:30px;cursor:pointer;touch-action:none;user-select:none}
.blocks{display:flex;gap:4px;height:100%}
.blk{min-width:0;border-radius:7px;background:var(--panel2);border:1px solid transparent;padding:0 8px;overflow:hidden;display:flex;align-items:center;gap:6px;font-size:12.5px;position:relative;color:var(--muted)}
.blk:hover{background:var(--soft)}
.blk b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--fg)}
.blk i{font-style:normal;white-space:nowrap;color:var(--muted)}
.blk.on{border-color:var(--line2);background:var(--soft)}
.blk .more{margin-left:auto;border:1px solid transparent;background:transparent;border-radius:6px;width:24px;height:20px;display:grid;place-items:center;color:var(--fg);padding:0;flex:none}
.blk .more:hover,.blk .more[aria-expanded="true"]{border-color:var(--fg)}
.blk .tag{font-size:10.5px;color:var(--faint);white-space:nowrap}
.addblk{flex:none;width:30px;border-radius:7px;border:1px dashed var(--line2);background:transparent;display:grid;place-items:center;color:var(--muted);padding:0}
.addblk:hover{color:var(--fg);border-color:var(--muted)}
.head{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);pointer-events:none;border-radius:2px;z-index:3}
.cpin{position:absolute;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--sel);border:2px solid var(--panel);transform:translateX(-50%);pointer-events:none;z-index:2}
.cpin.done{background:#6b6b6b}
.scenepop{position:absolute;z-index:30;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.scenepop .sp1{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.scenepop .hdr{display:flex;align-items:center;gap:8px}
.scenepop .hdr input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:0 8px;font-weight:500}
.scenepop .hdr span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.scenepop textarea{border:0;background:transparent;color:var(--muted);resize:none;padding:0;font-size:13px;line-height:1.45;min-height:38px;outline:none}
.scenepop .foot2{border-top:1px solid var(--line);padding:4px 6px}
.drawer{border-top:1px solid var(--line);padding:6px 10px 10px;max-height:260px;overflow:auto}
.drawer .dh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.drawer .dh b{color:var(--fg);font-weight:600}
.ruler{position:relative;height:16px;font:11px var(--font-mono);color:var(--faint);margin-left:140px}
.ruler span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ruler span:first-child{transform:none}
.alane{position:relative;margin-top:4px;border-radius:8px;background:var(--panel2);touch-action:none;user-select:none}
.alane canvas{display:block;width:100%;height:100%}
.alane .empty2{font-size:12px;color:var(--muted);padding:6px 10px;display:flex;align-items:center;gap:8px}
.layscroll{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.laywrap{position:relative}
.lr{display:flex;height:27px;border-bottom:1px solid var(--line);cursor:pointer}
.lr:last-child{border-bottom:0}
.lr.on{background:var(--sel-soft)}
.lname .lk{margin-left:auto;flex:none;width:18px;height:18px;padding:0;border:0;background:none;color:var(--faint);opacity:0;cursor:pointer;display:grid;place-items:center}.lname .lk svg{width:12px;height:12px}.lr:hover .lname .lk,.lname .lk.on{opacity:1}.lname .lk.on{color:var(--fg)}
.lname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname{width:140px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-right:1px solid var(--line);font-size:12px;overflow:hidden}
.lname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname svg{width:13px;height:13px;color:var(--muted)}

function cubicBezier(x1,y1,x2,y2){

    if(x<=0)return 0;if(x>=1)return 1;

function curveSVG(bz){
  var W=200,H=140,pd=18,X=function(x){return pd+x*(W-2*pd)},Y=function(y){return H-pd-y*(H-2*pd)*.72-(H-2*pd)*.14};
  var path='M'+X(0)+','+Y(0)+' C'+X(bz[0])+','+Y(bz[1])+' '+X(bz[2])+','+Y(bz[3])+' '+X(1)+','+Y(1);
  return '<svg class="curve" id="curve" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Curva de aceleração">'+
    '<rect x="'+pd+'" y="'+Y(1)+'" width="'+(W-2*pd)+'" height="'+(Y(0)-Y(1))+'" fill="none" stroke="currentColor" stroke-opacity=".15"/>'+
    '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(bz[0])+'" y2="'+Y(bz[1])+'" stroke="currentColor" stroke-opacity=".45"/>'+
    '<line x1="'+X(1)+'" y1="'+Y(1)+'" x2="'+X(bz[2])+'" y2="'+Y(bz[3])+'" stroke="currentColor" stroke-opacity=".45"/>'+
    '<path d="'+path+'" fill="none" stroke="#E0A21B" stroke-width="2.5"/>'+
    '<circle class="hd" data-h="1" cx="'+X(bz[0])+'" cy="'+Y(bz[1])+'" r="6" fill="#E0A21B"/>'+
    '<circle class="hd" data-h="2" cx="'+X(bz[2])+'" cy="'+Y(bz[3])+'" r="6" fill="#E0A21B"/></svg>';
}
function curveFromPoint(svg,ev){var r=svg.getBoundingClientRect(),W=200,H=140,pd=18,x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;return {x:clamp((x-pd)/(W-2*pd),0,1),y:clamp(((H-pd-y)-(H-2*pd)*.14)/((H-2*pd)*.72),-.6,1.6)}}

function parseTable(txt){
  txt=String(txt||'').replace(/\r/g,'').trim();if(!txt)return {cols:[],rows:[]};
  var lines=txt.split('\n').filter(function(l){return l.trim()}),sep=lines[0].indexOf('\t')>=0?'\t':(lines[0].split(';').length>lines[0].split(',').length?';':',');
  function split(l){if(sep==='\t')return l.split('\t');var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
  var cols=split(lines[0]).map(function(c,i){return c.trim().replace(/[^\w.\-À-ÿ]/g,'_')||('col'+(i+1))});
  var rows=lines.slice(1).map(function(l){var v=split(l),r={};cols.forEach(function(c,i){r[c]=(v[i]||'').trim()});return r});
  return {cols:cols,rows:rows};
}
function applyTable(kind,txt){

    var lines=String(txt).replace(/\r/g,'').trim().split('\n').filter(Boolean),sep=lines[0].indexOf('\t')>=0?'\t':(lines[0].indexOf(';')>=0?';':',');
    var data=lines.map(function(l){var p=l.split(sep);return {label:(p[0]||'').trim(),value:num((p[1]||'').trim())}}).filter(function(d){return d.label});
    if(data.length&&!isFinite(parseFloat(String(lines[0].split(sep)[1]||'').replace(',','.'))))data.shift();
    if(!data.length){toast('Cole duas colunas: nome e valor.');return}

var lastIssues=null,claudeReview='';
function runChecks(){
  var out=[],mw=Math.min(PW,PH);
  P.scenes.forEach(function(sc,si){
    var bgc=solid(sc.bg)||P.theme.bg,words=0,firstText=null;
    sc.els.forEach(function(e,ei){
      var b=bbox(e),nm=elName(e);
      if(e.kind==='text'||e.kind==='counter'||e.kind==='chart'){
        var under=bgc;for(var k=ei-1;k>=0;k--){var s2=sc.els[k];if(s2.kind==='shape'&&s2.fill){var b2=bbox(s2);if(b.x+b.w/2>=b2.x&&b.x+b.w/2<=b2.x+b2.w&&b.y+b.h/2>=b2.y&&b.y+b.h/2<=b2.y+b2.h){under=solid(s2.fill,bgc);break}}}
        var fc=solid(e.kind==='chart'?e.textColor:e.color,under);
        if(fc){var cr=Math.floor(contrast(fc,under)*10)/10,sz=(+e.size||30)*720/mw,big=sz>=36||(sz>=24&&(+e.weight||500)>=700)||e.kind==='counter',need=big?3:4.5;
          if(cr<need)out.push({sev:cr<2.2?'erro':'aviso',si:si,id:e.id,msg:'Contraste baixo em «'+nm+'»',det:'Razão '+cr.toFixed(1)+':1, o mínimo recomendado é '+need+':1.',fix:'contrast'})}
      }
      if(e.kind==='text'){var L=tlayout(e);words+=sub(e.text).split(/\s+/).filter(Boolean).length;if(firstText==null||e.start<firstText)firstText=+e.start||0;
        if(L.over)out.push({sev:'aviso',si:si,id:e.id,msg:'Palavra maior que a caixa em «'+nm+'»',det:'Aumente a largura ou diminua o tamanho.',fix:'widen'});
        if((+e.size||0)*720/mw<20)out.push({sev:'aviso',si:si,id:e.id,msg:'Texto pequeno em «'+nm+'»',det:'Em celular fica difícil de ler. Use pelo menos '+Math.round(20*mw/720)+' px.',fix:'bigger'})}
      var lt=sc.dur-.05,ev=evalEl(e,lt),bb=bbox(ev),pad=2;
      if(e.kind!=='shape'||(bb.w<PW*.95&&bb.h<PH*.95)){if(bb.x<-pad||bb.y<-pad||bb.x+bb.w>PW+pad||bb.y+bb.h>PH+pad){if(!(e.kind==='shape'&&(bb.w>=PW||bb.h>=PH)))out.push({sev:'aviso',si:si,id:e.id,msg:'«'+nm+'» sai do quadro',det:'Parte do elemento fica fora da tela no fim da cena.',fix:'inside'})}}
      if((e.kind==='image'||e.kind==='video')&&!e.src)out.push({sev:'erro',si:si,id:e.id,msg:KNAME[e.kind]+' sem arquivo',det:'Envie ou escolha uma mídia para este elemento.'});
    });
    if(words){var avail=Math.max(.5,sc.dur-(firstText||0)-.4),wps=words/avail;if(wps>3.1)out.push({sev:wps>4.2?'erro':'aviso',si:si,msg:'Pouco tempo para ler a cena '+(si+1),det:words+' palavras em '+fmtS(avail)+' ('+wps.toFixed(1)+' palavras/s). O ideal é até 3.',fix:'longer'})}
  });
  var lastS=P.scenes[P.scenes.length-1],lastIn=Math.max.apply(null,lastS.els.map(function(e){return (+e.start||0)+((e.anim&&+e.anim.t)||.6)}).concat([0]));
  if(lastS.dur-lastIn<1.2)out.push({sev:'aviso',si:P.scenes.length-1,msg:'O final some rápido demais',det:'A última cena fica completa por só '+fmtS(Math.max(0,lastS.dur-lastIn))+'. Deixe pelo menos 1,5 s.',fix:'hold'});
  if(total()>90)out.push({sev:'aviso',si:0,msg:'Vídeo longo para redes sociais',det:'Com '+fmtS(total())+', considere uma versão de até 60 s.'});
  return out;
}
function fixIssue(x){
  var sc=P.scenes[x.si],e=x.id?findEl(x.id,sc):null;
  if(x.fix==='contrast'&&e){var bgc=solid(sc.bg)||P.theme.bg;var opts=['@ink','@on','@bg','@accent'];var key=e.kind==='chart'?'textColor':'color';var best=opts.reduce(function(b,o){return contrast(solid(o),bgc)>contrast(solid(b),bgc)?o:b},opts[0]);
    var ei=sc.els.indexOf(e);for(var k=ei-1;k>=0;k--){var s2=sc.els[k];if(s2.kind==='shape'&&s2.fill){var b=bbox(e),b2=bbox(s2);if(b.x+b.w/2>=b2.x&&b.x+b.w/2<=b2.x+b2.w&&b.y+b.h/2>=b2.y&&b.y+b.h/2<=b2.y+b2.h){var u=solid(s2.fill,bgc);best=opts.reduce(function(bb,o){return contrast(solid(o),u)>contrast(solid(bb),u)?o:bb},opts[0]);break}}}
    e[key]=best}
  if(x.fix==='widen'&&e){e.w=Math.min(PW-e.x-20,Math.round(e.w*1.3));if(tlayout(e).over)e.size=Math.round(e.size*.85)}
  if(x.fix==='bigger'&&e)e.size=Math.round(22*Math.min(PW,PH)/720);
  if(x.fix==='inside'&&e){var bb=bbox(e);e.x=clamp(e.x,0,Math.max(0,PW-bb.w));e.y=clamp(e.y,0,Math.max(0,PH-bb.h));if(e.kf){(e.kf.x||[]).forEach(function(k){k.v=clamp(k.v,0,Math.max(0,PW-bb.w))});(e.kf.y||[]).forEach(function(k){k.v=clamp(k.v,0,Math.max(0,PH-bb.h))})}}
  if(x.fix==='longer'){var words=0,ft=99;sc.els.forEach(function(q){if(q.kind==='text'){words+=sub(q.text).split(/\s+/).filter(Boolean).length;ft=Math.min(ft,+q.start||0)}});sc.dur=Math.round((Math.min(ft,sc.dur)+.6+words/2.8)*10)/10}
  if(x.fix==='hold'){var ls=P.scenes[P.scenes.length-1],li=Math.max.apply(null,ls.els.map(function(q){return (+q.start||0)+((q.anim&&+q.anim.t)||.6)}).concat([0]));ls.dur=Math.round((li+1.8)*10)/10}
}

   Mídia externa: imagens, vídeos e áudio
   ========================================================= */
var ACCEPT_UP={'image/png':1,'image/jpeg':1,'image/gif':1,'image/webp':1,'image/svg+xml':1,'video/mp4':1,'video/webm':1,'application/json':1};
var MAX_UP=20*1024*1024;
function readDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(f)})}
function probe(kind,url){return new Promise(function(res){
  if(kind==='image'){var im=new Image();im.onload=function(){res({w:im.naturalWidth,h:im.naturalHeight})};im.onerror=function(){res({})};im.src=url}
  else if(kind==='video'){var v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=function(){res({w:v.videoWidth,h:v.videoHeight,dur:v.duration})};v.onerror=function(){res({})};v.src=url}
  else res({});
})}
/* guarda um arquivo: no artefato (assets) quando possível, senão só nesta sessão */
function storeFile(f,kind){
  var local=URL.createObjectURL(f);
  var finish=function(src,enc,persisted){var id=src.slice(src.indexOf(':')+1);LOCAL[id]=local;return {src:src,enc:enc||'',persisted:persisted}};
  if(!CAP.assets)return Promise.resolve(finish('local:'+nid('m'),'',false));
  if(window.__LOCAL_APP){var ty=f.type||(kind==='model'?'model/gltf-binary':kind==='lottie'?'application/json':kind==='svg'?'image/svg+xml':'application/octet-stream');return CAP.assets.upload(f,{type:ty}).then(function(r){return finish('asset:'+r.id,'',true)}).catch(function(e){toast('Não foi possível salvar o arquivo no PC: '+((e&&e.message)||''));return finish('local:'+nid('m'),'',false)})}
  if(kind==='audio'&&/^video\/(mp4|webm)$/.test(f.type)&&f.size<=ASSET_MAX){return CAP.assets.upload(f,{type:f.type}).then(function(r){return finish('asset:'+r.id,'',true)}).catch(function(e){uploadErr(e);return finish('local:'+nid('m'),'',false)})}
  if(kind==='audio'||kind==='model'){
    return readDataURL(f).then(function(du){var blob=new Blob([du],{type:'text/plain'});if(blob.size>MAX_UP)return finish('local:'+nid('m'),'',false);
      return CAP.assets.upload(blob,{type:'text/plain'}).then(function(r){return finish('asset:'+r.id,'b64',true)})}).catch(function(e){uploadErr(e);return finish('local:'+nid('m'),'',false)});
  }
  if(kind==='lottie'&&f.type!=='application/json'){f=new File([f],f.name,{type:'application/json'})}
  if(kind==='svg'&&f.type!=='image/svg+xml'){f=new File([f],f.name,{type:'image/svg+xml'})}
  if(!ACCEPT_UP[f.type]||f.size>MAX_UP){toast(f.size>MAX_UP?'Arquivo acima de 20 MB: vai funcionar nesta sessão, mas não fica salvo no artefato.':'Formato '+(f.type||'desconhecido')+' não fica salvo no artefato. Use MP4, WebM, PNG, JPG, GIF ou WebP.');return Promise.resolve(finish('local:'+nid('m'),'',false))}

  else if(/frente|foreground|^fg|primeiro/.test(low))o.role='fg';

  else if(/objeto|produto|subject|personagem|character|item/.test(low))o.role='obj';

function mergeInto(tg,src){Object.keys(src||{}).forEach(function(k){if(k==='id')return;var v=src[k];if(isObj(v)&&isObj(tg[k]))mergeInto(tg[k],v);else tg[k]=clone(v)})}
function applyOps(ops){
  var n=0,errs=[],first=null;if(!Array.isArray(ops))return {n:0,errs:[]};
  ops.forEach(function(op){try{
    if(!op||!op.op)return;
    switch(op.op){
      case 'replace_project':{var media=P.media,audio=P.audio,np=normProject(Object.assign({},op.project||{}));np.media=media.concat((np.media||[]).filter(function(m){return !media.some(function(x){return x.id===m.id})}));if(!(op.project&&op.project.audio))np.audio=audio;P=np;first=0;selScene=0;selEl=null;n++;break}
      case 'update':{
        if(op.id==='project'){var pr=Object.assign({},op.props||{});delete pr.scenes;mergeInto(P,pr);P=normProject(P);n++;break}
        var f=findAny(op.id);
        if(f&&f.el){var ix=f.scene.els.indexOf(f.el);var ne=clone(f.el);mergeInto(ne,op.props);var r=normEl(ne);if(r){r.id=f.el.id;f.scene.els[ix]=r;n++;if(first==null)first=f.si}}
        else if(f&&f.scene){var ns=clone(f.scene);mergeInto(ns,op.props);P.scenes[f.si]=normScene(ns,f.si);P.scenes[f.si].id=f.scene.id;n++;if(first==null)first=f.si}
        else{var tr=trackById(op.id);if(tr){mergeInto(tr,op.props);n++}else errs.push('id '+op.id+' não encontrado')}
        break}
      case 'add_element':{var fs=findAny(op.scene);var sc=fs&&fs.scene&&!fs.el?fs.scene:curScene();var e=normEl(op.element||{});if(!e){errs.push('elemento inválido');break}
        if(op.index!=null&&isFinite(op.index))sc.els.splice(clamp(op.index|0,0,sc.els.length),0,e);else sc.els.push(e);n++;if(first==null)first=P.scenes.indexOf(sc);break}
      case 'remove':{var fr=findAny(op.id);if(fr&&fr.el){fr.scene.els.splice(fr.scene.els.indexOf(fr.el),1);n++;if(first==null)first=fr.si}else if(fr&&fr.scene&&P.scenes.length>1){P.scenes.splice(fr.si,1);n++;first=Math.max(0,fr.si-1)}else if(trackById(op.id)){P.audio=P.audio.filter(function(a){return a.id!==op.id});n++}break}
      case 'add_scene':{var s=normScene(op.scene||{},P.scenes.length);var at=0;if(op.after){var fa=findAny(op.after);at=fa?fa.si+1:P.scenes.length}P.scenes.splice(at,0,s);n++;if(first==null)first=at;break}
      case 'move_scene':{var fm=findAny(op.id);if(fm&&!fm.el){var sm=P.scenes.splice(fm.si,1)[0];var to=clamp(op.index|0,0,P.scenes.length);P.scenes.splice(to,0,sm);n++;if(first==null)first=to}break}
      case 'set_format':{var F=FORMATS[op.format];if(F){reflowProject(P,F[0],F[1]);n++}break}
      case 'add_keyframe':{var fk=findAny(op.id);if(fk&&fk.el&&ANIMATABLE.indexOf(op.prop)>=0){setKey(fk.el,op.prop,+op.t||0,+op.v);var arr=fk.el.kf[op.prop];arr.forEach(function(k){if(Math.abs(k.t-(+op.t||0))<.03&&op.e)k.e=op.e});n++;if(first==null)first=fk.si}break}
      case 'snap_to_beats':{if(snapToBeats())n++;break}
      case 'set_captions':{var cc=capCfg();['on','style','pos','size','color','hl','upper'].forEach(function(k){if(op[k]!=null)cc[k]=op[k]});if(Array.isArray(op.items))cc.items=op.items.map(function(it){return {t0:+it.t0||0,t1:+it.t1||0,text:String(it.text||'')}});else if(typeof op.script==='string')cc.items=timeCaptions(chunkScript(op.script,cc.style==='pop'?4:7));capCfg();n++;break}
    }
  }catch(x){errs.push(String(x&&x.message||x))}});
  return {n:n,errs:errs,first:first};
}

var CAP_STYLES=[['pop','Palavra a palavra'],['karaoke','Karaokê'],['box','Caixa'],['line','Clássica']];
function capCfg(){
  if(!isObj(P.captions))P.captions={};var c=P.captions;
  if(typeof c.on!=='boolean')c.on=true;if(!CAP_STYLES.some(function(s){return s[0]===c.style}))c.style='pop';
  if(['bottom','center','top'].indexOf(c.pos)<0)c.pos='bottom';
  c.size=+c.size||0;if(!c.color)c.color='#ffffff';if(!c.hl)c.hl='@accent';if(typeof c.upper!=='boolean')c.upper=false;
  if(!Array.isArray(c.items))c.items=[];
  c.items=c.items.filter(function(it){return it&&isFinite(+it.t0)&&isFinite(+it.t1)&&+it.t1>+it.t0}).slice(0,800);
  return c;
}
function capWords(it){
  var ws=String(it.text||'').trim().split(/\s+/).filter(Boolean),tot=0;
  var wt=ws.map(function(w){var k=w.length+2;tot+=k;return k}),t=+it.t0,d=(+it.t1)-(+it.t0);
  return ws.map(function(w,i){var a=t;t+=d*wt[i]/tot;return {w:w,a:a,b:t}});
}
function drawCaptions(tt){
  var c=P.captions;if(!c||!c.on||!c.items||!c.items.length)return;
  var it=null;for(var i=0;i<c.items.length;i++){var x=c.items[i];if(tt>=+x.t0&&tt<+x.t1){it=x;break}}
  if(!it)return;
  var s=Math.min(PW,PH),st=c.style,fs=(+c.size||0)>0?+c.size:Math.round(s*(st==='pop'?.075:st==='line'?.045:.055));
  var words=capWords(it),maxW=PW*(st==='line'?.84:.8),font=fnt(st==='line'?600:800,fs,'ui');
  ctx.save();ctx.font=font;ctx.textBaseline='alphabetic';
  var sp=ctx.measureText(' ').width,lines=[[]],lw=[0];
  words.forEach(function(w){var txt=c.upper?w.w.toUpperCase():w.w,ww=ctx.measureText(txt).width;w.txt=txt;w.ww=ww;var L=lines.length-1;
    if(lines[L].length&&lw[L]+sp+ww>maxW){lines.push([]);lw.push(0);L++}
    lw[L]+=(lines[L].length?sp:0)+ww;lines[L].push(w)});
  if(st==='pop'){ /* mostra só a linha da palavra atual */
    var cur=0;lines.forEach(function(l,li){l.forEach(function(w){if(tt>=w.a)cur=li})});lines=[lines[cur]];lw=[lw[cur]];
  }
  var lh=fs*1.22,H=lines.length*lh,y0=c.pos==='top'?PH*.12:c.pos==='center'?PH/2-H/2:PH*.86-H;
  var hl=resolve(c.hl)||P.theme.accent,col=resolve(c.color)||'#fff',fin=clamp((tt-it.t0)/.18,0,1),fout=clamp((it.t1-tt)/.15,0,1),al=Math.min(fin,fout);
  if(st==='box'||st==='line'){
    var bw=Math.max.apply(null,lw)+fs*.9,bh=H+fs*.45;
    ctx.globalAlpha=al;
    if(st==='box'){ctx.fillStyle='rgba(0,0,0,.72)';rr(PW/2-bw/2,y0-fs*.2,bw,bh,fs*.25);ctx.fill()}
  }
  lines.forEach(function(l,li){
    var x=PW/2-lw[li]/2,y=y0+li*lh+fs*.95;
    l.forEach(function(w){
      var on=tt>=w.a,now=tt>=w.a&&tt<w.b;ctx.save();
      if(st==='pop'){
        if(!on){ctx.restore();x+=w.ww+sp;return}
        var k=clamp((tt-w.a)/.12,0,1),sc=1+.25*(1-k)*(1-k);ctx.globalAlpha=Math.min(1,k*2)*fout;
        ctx.translate(x+w.ww/2,y-fs*.35);ctx.scale(sc,sc);ctx.translate(-(x+w.ww/2),-(y-fs*.35));
        ctx.lineJoin='round';ctx.lineWidth=fs*.16;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(w.txt,x,y);
        ctx.fillStyle=now?hl:col;ctx.fillText(w.txt,x,y);
      }else if(st==='karaoke'){
        ctx.globalAlpha=al;ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(w.txt,x,y);
        ctx.fillStyle=on?hl:col;ctx.fillText(w.txt,x,y);
      }else{
        ctx.globalAlpha=al;if(st==='line'){ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=fs*.25;ctx.shadowOffsetY=fs*.04}
        ctx.fillStyle=col;ctx.fillText(w.txt,x,y);
      }
      ctx.restore();x+=w.ww+sp;
    });
  });
  ctx.restore();
}
/* divide um roteiro em blocos curtos */
function chunkScript(text,maxWords){
  maxWords=maxWords||6;var out=[];
  String(text||'').replace(/\r/g,'').split(/\n+|(?<=[.!?…])\s+/).forEach(function(sent){
    var ws=sent.trim().split(/\s+/).filter(Boolean);if(!ws.length)return;
    var n=Math.ceil(ws.length/maxWords),per=Math.ceil(ws.length/n);
    for(var i=0;i<ws.length;i+=per)out.push(ws.slice(i,i+per).join(' '));
  });
  return out;
}
/* trechos com fala numa trilha de voz (em segundos da linha do tempo) */
function voiceSegments(tr){
  var buf=AE.buffers[tr.id];if(!buf)return null;
  if(!AE.segs)AE.segs={};var key=tr.id+':'+(+tr.start||0)+':'+(+tr.offset||0);if(AE.segs[key])return AE.segs[key];
  var sr=buf.sampleRate,ch=buf.getChannelData(0),win=Math.round(sr*.05),n=Math.floor(ch.length/win),rms=new Float32Array(n),mx=0;
  for(var i=0;i<n;i++){var s=0,o=i*win;for(var j=0;j<win;j+=2){var v=ch[o+j];s+=v*v}rms[i]=Math.sqrt(s/(win/2));if(rms[i]>mx)mx=rms[i]}
  var thr=Math.max(.012,mx*.1),segs=[],a=-1;
  for(i=0;i<=n;i++){var on=i<n&&rms[i]>thr;if(on&&a<0)a=i;if(!on&&a>=0){segs.push([a*.05,i*.05]);a=-1}}
  var m=[];segs.forEach(function(g){if(m.length&&g[0]-m[m.length-1][1]<.35)m[m.length-1][1]=g[1];else m.push(g.slice())});
  m=m.filter(function(g){return g[1]-g[0]>=.15});
  var off=+tr.offset||0,st=+tr.start||0;
  var res=m.map(function(g){return [st+g[0]-off,st+g[1]-off]}).filter(function(g){return g[1]>0}).map(function(g){return [Math.max(0,g[0]),g[1]]});
  AE.segs[key]=res;return res;
}
function allVoiceSegments(){var out=[];P.audio.forEach(function(tr){if(tr.role==='voice'){var s=voiceSegments(tr);if(s)out=out.concat(s)}});return out.sort(function(a,b){return a[0]-b[0]})}
/* distribui blocos pelo tempo: sobre os trechos de fala se houver voz, senão pelo vídeo todo */
function timeCaptions(chunks){
  var segs=allVoiceSegments(),tot=total();if(!segs.length)segs=[[.2,Math.max(.5,tot-.2)]];
  var speech=segs.reduce(function(a,g){return a+g[1]-g[0]},0),wc=chunks.map(function(c){return c.split(/\s+/).length}),W=wc.reduce(function(a,b){return a+b},0)||1;
  var items=[],si=0,pos=segs[0][0];
  chunks.forEach(function(c,i){
    var d=speech*wc[i]/W,t0=pos,left=d;
    while(left>1e-3&&si<segs.length){var room=segs[si][1]-pos;if(room>left){pos+=left;left=0}else{left-=room;si++;pos=si<segs.length?segs[si][0]:pos}}
    items.push({t0:t0,t1:Math.max(t0+.3,pos),text:c});
  });
  /* bloco que atravessa uma pausa fica do lado onde tem mais fala */
  items.forEach(function(it){
    segs.forEach(function(g,k){var nx=segs[k+1];if(!nx)return;
      if(it.t0<g[1]&&it.t1>nx[0]){var before=g[1]-it.t0,after=it.t1-nx[0];if(before>=after)it.t1=g[1]+.25;else it.t0=nx[0]}});
  });
  return items.map(function(it){return {t0:Math.round(it.t0*100)/100,t1:Math.round(it.t1*100)/100,text:it.text}});
}
function fmtSrtT(s){s=Math.max(0,s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=Math.floor(s%60),ms=Math.round((s-Math.floor(s))*1000);if(ms===1000){ms=999}return [h,m,ss].map(function(v){return ('0'+v).slice(-2)}).join(':')+','+('00'+ms).slice(-3)}
function toSrt(items){return items.map(function(it,i){return (i+1)+'\n'+fmtSrtT(+it.t0)+' --> '+fmtSrtT(+it.t1)+'\n'+it.text}).join('\n\n')+'\n'}
function parseSrt(txt){
  var out=[];String(txt||'').replace(/\r/g,'').split(/\n\s*\n/).forEach(function(b){
    var m=b.match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);if(!m)return;
    function T(h,mi,s,ms){return (+h)*3600+(+mi)*60+(+s)+(+ms)/Math.pow(10,ms.length)}
    var lines=b.split('\n'),k=lines.findIndex(function(l){return l.indexOf('-->')>=0}),text=lines.slice(k+1).join(' ').replace(/<[^>]+>/g,'').trim();
    if(text)out.push({t0:T(m[1],m[2],m[3],m[4]),t1:T(m[5],m[6],m[7],m[8]),text:text});
  });return out;

var saveTimer=null,saving=false,dirty=false,lastSaved='',remoteSeen=false,firstLoad=true;
function setSave(txt,bad){var s=$('#saveState');s.textContent=txt;s.classList.toggle('bad',!!bad)}
function scheduleSave(){
  if(isLocalProj(CURP)){dirty=true;setSave('Salvando…');clearTimeout(saveTimer);saveTimer=setTimeout(function(){if(firstLoad){scheduleSave();return}saveLocalNow(CURP,packProject(P)).catch(function(){})},900);return}
  dirty=true;setSave('Salvando…');clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,1200);
}
var saveRetry=0;
function flushSave(){
  if(isLocalProj(CURP)){saveLocalNow(CURP,packProject(P)).catch(function(){});return}
  if(saving||firstLoad){saveTimer=setTimeout(flushSave,700);return}
  var json=packProject(P);if(json===lastSaved){dirty=false;setSave('Salvo');return}
  if(CAN_WRITE===false){toLocalCopy({code:'permission_denied',message:'você só pode ver este artefato'});return}
  saving=true;var pid=CURP;
  writeProjectDoc(pid,json).then(function(){saveRetry=0;if(pid!==CURP)return;lastSaved=json;$('#saveState').title='';if(packProject(P)===json){dirty=false;setSave('Salvo')}CAP.db.doc('projlist/'+pid).set(projMeta(false)).catch(function(){})},
    function(e){var r=dbErr(e);saving=false;
      if(pid!==CURP)return;
      if(noWriteErr(r.code)){if(r.code!=='quota_exceeded')CAN_WRITE=false;return toLocalCopy(e)}
      setSave('Não salvo: '+r.why,true);$('#saveState').title=r.text;
      if(retryErr(r.code)&&saveRetry<5){saveRetry++;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,2000*saveRetry)}
      else toast('Não salvo: '+r.text,9000)})
  .then(function(){saving=false});
}
var remoteSeq=0;
function onRemoteProject(snap){
  var d0=snap.exists?snap.data():null;
  if(d0&&d0.parts){var my=++remoteSeq,pid=CURP;assembleProject(pid,d0).then(function(j){if(my!==remoteSeq||pid!==CURP)return;onRemoteProject2(snap.exists,Object.assign({},d0,{json:j}))},function(e){if(my!==remoteSeq)return;if(e&&e.code==='stale')return;/* chegam as partes novas em seguida */firstLoad=false;var r=dbErr(e);setSave('Projeto salvo incompleto',true);$('#saveState').title=r.text})
    return}
  remoteSeq++;onRemoteProject2(snap.exists,d0);
}
function onRemoteProject2(exists,d){
  if(!exists){if(CURP!=='main'){toast('Esse projeto não existe mais. Abrindo o principal.');CURP='main';rememberProj();refilter();subscribeProject();return}firstLoad=false;if(!remoteSeen){remoteSeen=true;setSave('Rascunho')}return}
  remoteSeen=true;d=d||{};if(typeof d.json!=='string'){firstLoad=false;return}
  if(firstLoad){firstLoad=false;dirty=false;clearTimeout(saveTimer);try{P=normProject(JSON.parse(d.json));lastSaved=d.json;hist=[JSON.stringify(P)];hi=0;updUndo();selScene=0;selEl=null;t=0;restoreIdbMedia();afterProjectChange();setSave('Salvo');var pid0=CURP;setTimeout(function(){if(pid0===CURP&&!PROJS.some(function(p){return p.id===CURP&&p.thumb}))writeIndex(true)},2500)}catch(x){setSave('Projeto salvo ilegível',true)}return}
  if(d.json===lastSaved)return;
  if(d.json===packProject(P)){lastSaved=d.json;setSave('Salvo');return}
  if(dirty||saving||drag||ldrag||adrag)return;
  try{
    var np=normProject(JSON.parse(d.json));lastSaved=d.json;P=np;
    hist=hist.slice(0,hi+1);hist.push(JSON.stringify(P));hi=hist.length-1;updUndo();afterProjectChange();setSave('Salvo');
    if(d.by&&d.by!==ME.id&&hist.length>1)toast('Atualizado por '+profName(d.by)+'.');
  }catch(x){}
}
function detectWrite(u){
  var p=null;try{p=u.can?u.can('data.write'):(u.canEdit?u.canEdit():null)}catch(x){p=null}
  Promise.resolve(p).then(function(v){if(v===false){CAN_WRITE=false;if(CAP.db&&!isLocalProj(CURP)){var s=$('#saveState');s.title='Você só pode ver este artefato. Se editar, as mudanças viram uma cópia local. '+LOCAL_MSG+'.'}}else if(v===true&&CAN_WRITE===null)CAN_WRITE=true},function(){});
}
function startDb(db){
  CAP.db=db;setSave('Conectando…');
  rememberProj();subscribeProject();
  db.collection('projlist').onSnapshot(function(s){PROJS=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});renderProjects()},function(){});
  db.collection('comments').onSnapshot(function(s){COMMENTS_ALL=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});refilter();resolveProfiles(COMMENTS.map(function(c){return c.by}))},function(){});
  db.collection('versions').orderBy('at','desc').limit(100).onSnapshot(function(s){VERSIONS_ALL=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});refilter()},function(){});
  db.collection('templates').orderBy('at','desc').limit(50).onSnapshot(function(s){TEMPLATES_SAVED=s.docs.map(function(d){var o=d.data();return {id:d.id,name:o.name,json:o.json}});if(tab==='brand')renderPanel()},function(){});
  db.doc('brand/kit').onSnapshot(function(s){if(s.exists){try{BRANDKIT=JSON.parse(s.data().json)}catch(x){}if(tab==='brand')renderPanel()}},function(){});
}

}
